        .arrow.right {

        let currentIndex = 0;

        function showPhoto(index) {
            const photoElement = document.getElementById('current-photo');
            photoElement.src = `photos/2025_7111_applewood_dr_web/${images[index]}`;
            //alert(photoElement.src)
            const photoIndexElement = document.getElementById('photo-index');
            photoIndexElement.textContent = `${index + 1} / ${images.length}`;
        }

        function prevPhoto() {
            currentIndex = (currentIndex > 0) ? currentIndex - 1 : images.length - 1;
            showPhoto(currentIndex);
        }

        function nextPhoto() {
            currentIndex = (currentIndex < images.length - 1) ? currentIndex + 1 : 0;
            showPhoto(currentIndex);
        }

<body>
    <div id="nav-placeholder"></div>
    <h2>Listing photos taken by Martin Menocal in March 2025</h2>

    <div id="photos">
        <span class="arrow left" onclick="prevPhoto()">&#9664;</span>
        <img id="current-photo" src="" alt="Listing Photo">
        <span class="arrow right" onclick="nextPhoto()">&#9654;</span>
    </div>
    <div id="photo-index" class="index-center"></div>

    <script>
        showPhoto(0);
        
        document.addEventListener("DOMContentLoaded", function() {
            fetch('nav.html')
                .then(response => response.text())
                .then(data => {
                    document.getElementById('nav-placeholder').innerHTML = data;
                });
        });
    </script>
